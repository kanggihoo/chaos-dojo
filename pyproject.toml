[project]
name = "chaos-lab"
version = "0.1.0"
description = "Rebuild one backend environment on demand, inject load and faults, compare impls"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    "openapi-spec-validator>=0.7.1",
    "psycopg[binary]>=3.2",
    "psutil>=6.1",
    "platformdirs>=4.3",
]

[project.scripts]
chaos = "chaos.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.120"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: needs a real Docker engine"]
addopts = "-m 'not docker'"
