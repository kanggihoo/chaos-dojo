spring.application.name=${SERVICE_NAME:orders}
spring.threads.virtual.enabled=false
spring.mvc.problemdetails.enabled=true

chaos.impl=${IMPL}
chaos.lookup.base-url=${LOOKUP_BASE_URL}
chaos.lookup.response-timeout-ms=${LOOKUP_RESPONSE_TIMEOUT_MS}
chaos.lookup.deadline-ms=${LOOKUP_DEADLINE_MS:0}
chaos.lookup.connect-timeout-ms=${LOOKUP_CONNECT_TIMEOUT_MS}
chaos.lookup.pool-max=${HTTP_POOL_MAX}
chaos.lookup.acquire-timeout-ms=${HTTP_POOL_ACQUIRE_TIMEOUT_MS}

server.port=${SERVER_PORT:8080}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS}
server.tomcat.mbeanregistry.enabled=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${JDBC_POOL_SIZE}
spring.datasource.hikari.connection-timeout=${JDBC_CONNECTION_TIMEOUT_MS}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

management.server.port=${MANAGEMENT_PORT}
chaos.management.threads=${MANAGEMENT_THREADS}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

management.tracing.sampling.probability=${TRACE_SAMPLING}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTLP_ENDPOINT}/v1/logs
management.otlp.metrics.export.enabled=false
management.opentelemetry.resource-attributes.chaos.run_id=${CHAOS_RUN_ID:none}
management.opentelemetry.resource-attributes.chaos.repeat=${CHAOS_REPEAT:none}
